<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --accent: #2f6fed; --border: #e2e0db; --danger: #c43d3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --panel: #222226; --text: #f2f2f4; --muted: #9a9aa2;
      --accent: #6b9bff; --border: #34343a; --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  h2 { font-size: 1rem; margin: 32px 0 12px; color: var(--muted); font-weight: 600; }

  .stage { perspective: 1200px; }
  .lift { transition: transform .25s ease; }
  .lift:hover { transform: translateY(-3px); }
  .card {
    position: relative; height: 260px; cursor: pointer; user-select: none;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.3, 1.35, .45, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim { transition: none; }
  .card:focus { outline: none; }
  .card:focus-visible .face { outline: 2px solid var(--accent); outline-offset: 3px; }
  .face {
    position: absolute; inset: 0; border-radius: 14px; padding: 28px 24px;
    background: var(--panel); border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; overflow: auto;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
  }
  .face.back { transform: rotateY(180deg); border-color: var(--accent); }
  .face .label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .face.back .label { color: var(--accent); }
  .face .content { font-size: 1.35rem; white-space: pre-wrap; word-break: break-word; }
  .face .hint { margin-top: 16px; font-size: .8rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .card, .lift { transition: none; }
  }

  .controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .counter { color: var(--muted); min-width: 64px; text-align: center; }

  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }

  form { display: grid; gap: 8px; }
  input, textarea {
    font: inherit; padding: 10px 12px; border-radius: 8px; width: 100%;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
    padding: 10px 12px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; margin-bottom: 6px;
  }
  li .q { font-weight: 600; }
  li .a { color: var(--muted); }
  li .text { min-width: 0; word-break: break-word; }
  li .actions { display: flex; gap: 6px; flex-shrink: 0; }
  li button { padding: 4px 10px; font-size: .85rem; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>Flashcards</h1>

  <section id="study">
    <div class="stage" id="stage">
      <div class="lift">
        <div id="card" class="card" tabindex="0" aria-live="polite">
          <div class="face front">
            <div class="label" id="frontLabel">Question</div>
            <div class="content" id="frontContent"></div>
            <div class="hint" id="frontHint">Click or press Space to flip</div>
          </div>
          <div class="face back">
            <div class="label">Answer</div>
            <div class="content" id="backContent"></div>
            <div class="hint">Click or press Space to flip back</div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="prevBtn" aria-label="Previous">&larr; Prev</button>
      <span class="counter" id="counter">0 / 0</span>
      <button id="nextBtn" aria-label="Next">Next &rarr;</button>
      <button id="shuffleBtn">Shuffle</button>
    </div>
  </section>

  <h2 id="formTitle">Add a card</h2>
  <form id="cardForm">
    <textarea id="qInput" placeholder="Question" required></textarea>
    <textarea id="aInput" placeholder="Answer" required></textarea>
    <div class="row">
      <button type="submit" class="primary" id="saveBtn">Add card</button>
      <button type="button" id="cancelEdit" hidden>Cancel</button>
    </div>
  </form>

  <h2>All cards</h2>
  <ul id="list"></ul>

  <h2>Backup</h2>
  <div class="row">
    <button id="exportBtn">Export JSON</button>
    <button id="importBtn">Import JSON</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</main>

<script>
const KEY = "flashcards.v1";
let cards = load();
let order = cards.map((_, i) => i);
let pos = 0;
let flipped = false;
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(cards)); } catch {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const $ = id => document.getElementById(id);

function resetOrder() {
  order = cards.map((_, i) => i);
  if (pos >= order.length) pos = Math.max(0, order.length - 1);
}

function renderCard() {
  const card = $("card");
  if (!cards.length) {
    card.classList.remove("flipped");
    $("frontLabel").textContent = "No cards yet";
    $("frontContent").textContent = "Add one below to get started.";
    $("frontHint").hidden = true;
    $("backContent").textContent = "";
    $("counter").textContent = "0 / 0";
    ["prevBtn", "nextBtn", "shuffleBtn"].forEach(b => $(b).disabled = true);
    return;
  }
  const c = cards[order[pos]];
  card.classList.toggle("flipped", flipped);
  $("frontLabel").textContent = "Question";
  $("frontContent").textContent = c.q;
  $("frontHint").hidden = false;
  $("backContent").textContent = c.a;
  $("counter").textContent = `${pos + 1} / ${order.length}`;
  $("prevBtn").disabled = pos === 0;
  $("nextBtn").disabled = pos === order.length - 1;
  $("shuffleBtn").disabled = order.length < 2;
}

// Swap content while the card is off screen, snapping it back to the question side
function swapInstantly(update) {
  const card = $("card");
  card.classList.add("no-anim");
  update();
  renderCard();
  void card.offsetWidth;
  card.classList.remove("no-anim");
}

function renderList() {
  const ul = $("list");
  ul.innerHTML = "";
  if (!cards.length) {
    ul.innerHTML = '<div class="empty">No cards yet.</div>';
    return;
  }
  cards.forEach(c => {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="text"><div class="q"></div><div class="a"></div></div>
      <div class="actions">
        <button data-act="edit">Edit</button>
        <button data-act="del" class="danger">Delete</button>
      </div>`;
    li.querySelector(".q").textContent = c.q;
    li.querySelector(".a").textContent = c.a;
    li.querySelector('[data-act="edit"]').onclick = () => startEdit(c.id);
    li.querySelector('[data-act="del"]').onclick = () => del(c.id);
    ul.appendChild(li);
  });
}

function render() { renderCard(); renderList(); }

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let animating = false;

function flip() {
  if (!cards.length || animating) return;
  flipped = !flipped;
  renderCard();
}

async function go(delta) {
  const n = pos + delta;
  if (n < 0 || n >= order.length || animating) return;
  if (reduceMotion) { pos = n; flipped = false; renderCard(); return; }

  animating = true;
  const stage = $("stage");
  const dir = delta > 0 ? -1 : 1; // next slides left, prev slides right
  const out = stage.animate(
    [{ transform: "none", opacity: 1 },
     { transform: `translateX(${dir * 90}px) rotate(${dir * 5}deg)`, opacity: 0 }],
    { duration: 200, easing: "ease-in", fill: "forwards" }
  );
  await out.finished;
  swapInstantly(() => { pos = n; flipped = false; });
  const inn = stage.animate(
    [{ transform: `translateX(${-dir * 90}px) rotate(${-dir * 5}deg)`, opacity: 0 },
     { transform: "none", opacity: 1 }],
    { duration: 300, easing: "cubic-bezier(.2, 1.2, .4, 1)" }
  );
  out.cancel();
  await inn.finished;
  animating = false;
}

async function shuffle() {
  if (animating || order.length < 2) return;
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  if (reduceMotion) { pos = 0; flipped = false; renderCard(); return; }

  animating = true;
  const stage = $("stage");
  const wobble = stage.animate(
    [{ transform: "none" },
     { transform: "translateX(-14px) rotate(-4deg)" },
     { transform: "translateX(12px) rotate(4deg) scale(.96)", opacity: .6 },
     { transform: "translateX(-8px) rotate(-2deg) scale(.96)", opacity: .6 },
     { transform: "none", opacity: 1 }],
    { duration: 500, easing: "ease-in-out" }
  );
  setTimeout(() => swapInstantly(() => { pos = 0; flipped = false; }), 250);
  await wobble.finished;
  animating = false;
}

function startEdit(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  $("qInput").value = c.q;
  $("aInput").value = c.a;
  $("formTitle").textContent = "Edit card";
  $("saveBtn").textContent = "Save changes";
  $("cancelEdit").hidden = false;
  $("qInput").focus();
}
function endEdit() {
  editingId = null;
  $("cardForm").reset();
  $("formTitle").textContent = "Add a card";
  $("saveBtn").textContent = "Add card";
  $("cancelEdit").hidden = true;
}
function del(id) {
  if (!confirm("Delete this card?")) return;
  cards = cards.filter(c => c.id !== id);
  if (editingId === id) endEdit();
  save(); resetOrder(); flipped = false; render();
}

$("cardForm").onsubmit = e => {
  e.preventDefault();
  const q = $("qInput").value.trim();
  const a = $("aInput").value.trim();
  if (!q || !a) return;
  if (editingId) {
    const c = cards.find(x => x.id === editingId);
    if (c) { c.q = q; c.a = a; }
    endEdit();
  } else {
    cards.push({ id: uid(), q, a });
    $("cardForm").reset();
    $("qInput").focus();
  }
  save(); resetOrder(); render();
};
$("cancelEdit").onclick = endEdit;

$("card").onclick = flip;
$("prevBtn").onclick = () => go(-1);
$("nextBtn").onclick = () => go(1);
$("shuffleBtn").onclick = shuffle;

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(cards, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "flashcards.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error();
    const incoming = data
      .filter(c => c && typeof c.q === "string" && typeof c.a === "string")
      .map(c => ({ id: uid(), q: c.q, a: c.a }));
    const replace = cards.length && confirm(
      `Import ${incoming.length} cards.\n\nOK = replace current cards\nCancel = add to current cards`
    );
    cards = replace ? incoming : cards.concat(incoming);
    save(); pos = 0; flipped = false; resetOrder(); render();
  } catch {
    alert("That file doesn't look like a flashcards export.");
  }
  e.target.value = "";
};

render();
</script>
</body>
</html>
